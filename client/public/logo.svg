<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <!-- Transparent background — works on both dark and light navbars -->

  <!-- TM mark -->
  <text x="296" y="18" font-family="Arial, sans-serif" font-size="9" fill="#C9A84C" font-weight="bold">™</text>

  <!-- ── Tree circle border (gold) ──────────────────────────────── -->
  <circle cx="160" cy="56" r="40" fill="none" stroke="#C9A84C" stroke-width="2"/>

  <!-- ── Tree canopy — lush green organic silhouette ────────────── -->
  <path d="
    M 160,22
    Q 168,20  174,26
    Q 182,30  183,40
    Q 188,46  185,54
    Q 183,60  177,62
    Q 174,67  168,67
    Q 165,72  160,72
    Q 155,72  152,67
    Q 146,67  143,62
    Q 137,60  135,54
    Q 132,46  137,40
    Q 138,30  146,26
    Q 152,20  160,22
    Z
  " fill="#3A8A50"/>

  <!-- Lighter green highlight on canopy for depth -->
  <path d="
    M 160,26
    Q 166,24  171,29
    Q 177,33  178,41
    Q 175,48  170,51
    Q 164,55  160,54
    Q 156,55  150,51
    Q 145,48  142,41
    Q 143,33  149,29
    Q 154,24  160,26
    Z
  " fill="#4DAA64" opacity="0.45"/>

  <!-- Leaf detail veins on canopy -->
  <line x1="160" y1="26" x2="160" y2="56" stroke="#1B4A2A" stroke-width="1"   opacity="0.4"/>
  <line x1="148" y1="34" x2="158" y2="52" stroke="#1B4A2A" stroke-width="0.9" opacity="0.3"/>
  <line x1="172" y1="34" x2="162" y2="52" stroke="#1B4A2A" stroke-width="0.9" opacity="0.3"/>
  <line x1="142" y1="48" x2="155" y2="56" stroke="#1B4A2A" stroke-width="0.8" opacity="0.25"/>
  <line x1="178" y1="48" x2="165" y2="56" stroke="#1B4A2A" stroke-width="0.8" opacity="0.25"/>

  <!-- Tree trunk (brown/timber tone) -->
  <rect x="155" y="70" width="10" height="18" fill="#7A5230" rx="2"/>

  <!-- Ground line (gold) -->
  <line x1="143" y1="88" x2="177" y2="88" stroke="#C9A84C" stroke-width="2.2" stroke-linecap="round"/>

  <!-- ── KAAYA — large bold gold serif ──────────────────────────── -->
  <text
    x="160" y="126"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="48"
    font-weight="bold"
    fill="#C9A84C"
    text-anchor="middle"
    letter-spacing="7"
  >KAAYA</text>

  <!-- Flanking lines for ECO RESORT (gold) -->
  <line x1="28"  y1="137" x2="100" y2="137" stroke="#C9A84C" stroke-width="0.9"/>
  <line x1="220" y1="137" x2="292" y2="137" stroke="#C9A84C" stroke-width="0.9"/>

  <!-- ── ECO RESORT ───────────────────────────────────────────────── -->
  <text
    x="160" y="145"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11.5"
    fill="#C9A84C"
    text-anchor="middle"
    letter-spacing="5.5"
  >ECO  RESORT</text>

  <!-- Thin rule -->
  <line x1="40" y1="158" x2="280" y2="158" stroke="#C9A84C" stroke-width="0.6" opacity="0.55"/>

  <!-- ── Location tagline ─────────────────────────────────────────── -->
  <text
    x="160" y="171"
    font-family="Arial, Helvetica, sans-serif"
    font-size="9"
    fill="#C9A84C"
    text-anchor="middle"
    letter-spacing="2.5"
  >YALA | KNUCKLES | KITHULGALA</text>
</svg>
